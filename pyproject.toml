[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linearbaseline"
version = "0.3.0"
description = "Honest linear baselines for cis-regulatory sequence-to-function prediction, including a full-bio CRE->gene arm on EPCrisprBenchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tri-Omics Transformer project" }]
keywords = ["regulatory genomics", "TF binding", "CRE", "baseline", "logistic regression"]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
linearbaseline = "linearbaseline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
