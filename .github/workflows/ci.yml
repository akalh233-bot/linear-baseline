name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: End-to-end smoke run
        run: |
          linearbaseline synthetic --out data/synthetic.npz --loci 1500
          linearbaseline train --config configs/synthetic.json --out results
          linearbaseline ablations --config configs/synthetic.json --out results
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: results/
